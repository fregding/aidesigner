<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>功能已禁用 - AI Designer Lite</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e5e7eb}
    .card{width:min(720px,calc(100% - 32px));background:rgba(15,23,42,.86);border:1px solid rgba(148,163,184,.28);border-radius:24px;padding:36px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .badge{display:inline-flex;border:1px solid rgba(96,165,250,.45);color:#93c5fd;border-radius:999px;padding:6px 12px;font-size:13px;margin-bottom:18px}
    h1{font-size:32px;margin:0 0 12px}.muted{color:#94a3b8;line-height:1.8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    a{color:white;text-decoration:none;background:#2563eb;padding:12px 18px;border-radius:12px}.ghost{background:transparent;border:1px solid rgba(148,163,184,.4)}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">AI Designer Lite · 本地调试版</div>
    <h1>该功能已暂时禁用</h1>
    <p class="muted">当前阶段只保留用户系统、后台、文件管理和本地图片生成。PPT、视频、支付、会员充值相关功能已从界面和后端路由禁用，避免误触外部 API 或支付接口。</p>
    <div class="actions">
      <a href="image.html">去本地图片生成</a>
      <a class="ghost" href="dashboard.html">返回工作台</a>
      <a class="ghost" href="admin.html">后台管理</a>
    </div>
  </main>
</body>
</html>
