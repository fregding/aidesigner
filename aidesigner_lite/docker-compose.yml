services:
  local-image-server:
    build:
      context: .
      dockerfile: local-image-server/Dockerfile
    image: aidesigner-local-image:mock
    restart: unless-stopped
    environment:
      LOCAL_IMAGE_BACKEND: mock
      LOCAL_IMAGE_API_KEY: local-dev-key
      LOCAL_IMAGE_MODEL_ID: local-mock-image
      LOCAL_IMAGE_HOST: 0.0.0.0
      LOCAL_IMAGE_PORT: 18080
      LOCAL_IMAGE_MAX_N: 1
    ports:
      - "${LOCAL_IMAGE_BIND:-127.0.0.1}:${LOCAL_IMAGE_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aidesigner:local
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DB_PATH: /data/aimaster.db
      UPLOAD_DIR: /uploads
      FRONTEND_ROOT: /app
      PPT_MASTER_ROOT: /app/external/ppt-master
      PPT_MASTER_PYTHON: /opt/ppt-venv/bin/python
      HOME: /data
      PYTHONDONTWRITEBYTECODE: "1"
      PORT: 3000
      IMAGE_BASE_URL: http://local-image-server:18080/v1
      IMAGE_API_KEY: local-dev-key
      IMAGE_MODEL: local-mock-image
      IMAGE_FAILOVER_ENABLED: "false"
      ENABLE_PPT: "false"
      ENABLE_VIDEO: "false"
      ENABLE_PAYMENT: "false"
    depends_on:
      local-image-server:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ./runtime/data:/data
      - ./runtime/uploads:/uploads
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
